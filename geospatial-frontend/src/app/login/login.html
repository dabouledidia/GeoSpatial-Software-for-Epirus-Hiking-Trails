<section class="vh-100">
  <div class="container py-5 h-100">
    <div class="row d-flex align-items-center justify-content-center h-100">
      <div class="col-md-8 col-lg-7 col-xl-6">
        <img src="https://mdbcdn.b-cdn.net/img/Photos/new-templates/bootstrap-login-form/draw2.svg"
          class="img-fluid" alt="Phone image">
      </div>
      <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
            <form [formGroup]="userCredentials" (ngSubmit)="login()">
                <div data-mdb-input-init class="form-outline mb-4">

                    <input type="email" id="email" class="form-control form-control-lg" formControlName="email">
                    <label class="form-label" for="email">Email</label>
                </div>

                <div data-mdb-input-init class="form-outline mb-4">

                    <input type="password" id="password" class="form-control form-control-lg" formControlName="password">
                    <label class="form-label" for="password">Password</label>
                </div>



          <button type="submit" data-mdb-button-init data-mdb-ripple-init class="btn btn-primary btn-lg btn-block">Sign in</button>
           
        <div class="d-flex justify-content-around align-items-center mb-4">
            <a routerLink="/register"> don't have an account</a>
        </div>

            </form>
      </div>
    </div>
  </div>
</section>
