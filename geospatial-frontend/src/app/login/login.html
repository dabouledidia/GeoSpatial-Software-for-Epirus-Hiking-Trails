<p>Please Login</p>

<form [formGroup]="userCredentials" (ngSubmit)="login()">
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="Enter Your Email" formControlName="email">

    <br/> <br/> <br/>
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter Your Password" formControlName="password">

    <br/><br/><br/>
    <button type="submit">Login </button>
        
    <br/><br/><br/>
    <a routerLink="/register"> don't have an account</a>
</form>
