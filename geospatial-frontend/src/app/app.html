<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<nav class="navbar navbar-expand-lg navbar-dark bg-black shadow-sm py-3">
  <div class="container-fluid">

    <a class="navbar-brand fw-bold fs-4" routerLink="/">
      <i class="bi bi-tree-fill"></i> Trail Explorer
    </a>

    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/trail-list">Trails</a>
        </li>

        <li class="nav-item" *ngIf="userService.getRole() === 'ROLE_ADMIN'">
          <a class="nav-link" routerLink="/user-management">Users</a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto">

        <ng-container *ngIf="!userService.isLoggedIn(); else loggedIn">

          <li class="nav-item">
            <a class="btn btn-outline-light me-2" routerLink="/login">Login</a>
          </li>

          <li class="nav-item">
            <a class="btn btn-light text-primary fw-bold" routerLink="/register">Register</a>
          </li>

        </ng-container>

        <ng-template #loggedIn>
  <li class="nav-item dropdown">

<a class="nav-link" href="#" data-bs-toggle="dropdown" aria-expanded="false">
  <button class="avatar-trigger">
    <div class="avatar-initials">
      {{ userService.getUser()?.[0]?.toUpperCase() }}
    </div>
    <span class="avatar-name">{{ userService.getUser() }}</span>
    <svg class="chevron" width="14" height="14" viewBox="0 0 14 14" fill="none">
      <path d="M3 5l4 4 4-4" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</a>

<ul class="dropdown-menu dropdown-menu-end user-dropdown">
  <li class="user-dropdown__header">
    <div class="avatar-initials avatar-initials--lg">
      {{ userService.getUser()?.[0]?.toUpperCase() }}
    </div>
    <div>
      <p class="user-dropdown__name">{{ userService.getUser() }}</p>
      <p class="user-dropdown__email">{{ userService.getRole() }}</p>
    </div>
  </li>



      <li><hr class="dropdown-divider"></li>

      <li>
        <a class="user-dropdown__item" routerLink="/profile">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="5.5" r="2.5" stroke="currentColor" stroke-width="1.3"/>
            <path d="M2.5 13c0-2.485 2.462-4.5 5.5-4.5s5.5 2.015 5.5 4.5"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
          Profile
        </a>
      </li>



      <li><hr class="dropdown-divider"></li>

      <li>
        <a class="user-dropdown__item user-dropdown__item--danger" href="#" (click)="logout()">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <path d="M6 2H3a1 1 0 00-1 1v10a1 1 0 001 1h3"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            <path d="M10 11l3-3-3-3M13 8H6"
              stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Log out
        </a>
      </li>

    </ul>
  </li>
</ng-template>

      </ul>
    </div>
  </div>
</nav>


<router-outlet></router-outlet>
