<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand fw-bold fs-4" routerLink="/">
      <i class="bi bi-tree-fill"></i> Trail Explorer
    </a>

    <!-- Mobile toggle -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/trail-list">Trails</a>
        </li>

        <li class="nav-item" *ngIf="userService.getRole() === 'ROLE_ADMIN'">
          <a class="nav-link" routerLink="/user-management">Users</a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto">

        <ng-container *ngIf="!userService.isLoggedIn(); else loggedIn">

          <li class="nav-item">
            <a class="btn btn-outline-light me-2" routerLink="/login">Login</a>
          </li>

          <li class="nav-item">
            <a class="btn btn-light text-primary fw-bold" routerLink="/register">Register</a>
          </li>

        </ng-container>

        <ng-template #loggedIn>
          
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle fw-semibold" href="#" data-bs-toggle="dropdown">
              <button pRipple class="relative overflow-hidden w-full border-0 bg-transparent flex items-start p-2 pl-4 hover:bg-surface-100 dark:hover:bg-surface-800 rounded-none cursor-pointer transition-colors duration-200">
                        <p-avatar image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png" class="mr-2" shape="circle" />                       
                    </button>
            </a>

            <ul class="dropdown-menu dropdown-menu-end">
              <li><hr class="dropdown-divider"></li>
              <li>
                 <a class="btn btn-light text-primary" routerLink="/profile">
              <i class="bi bi-person-circle"></i> Profile
            </a>
                <a class="dropdown-item text-danger" href="#" (click)="logout()">
                  <i class="bi bi-box-arrow-right"></i> Log Out
                </a>

                <button pRipple 
                    class="relative overflow-hidden w-full border-0 bg-transparent flex items-center gap-3 p-3 hover:bg-surface-100 dark:hover:bg-surface-800 cursor-pointer transition-colors duration-200">

                    <p-avatar 
                        image="https://primefaces.org/cdn/primeng/images/demo/avatar/amyelsner.png"
                        shape="circle">
                    </p-avatar>
                </button>
              </li>
            </ul>
          </li>
        </ng-template>

      </ul>
    </div>
  </div>
</nav>


<router-outlet></router-outlet>
