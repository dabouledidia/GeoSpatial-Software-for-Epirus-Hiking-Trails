<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm py-3">
  <div class="container-fluid">

    <!-- Logo -->
    <a class="navbar-brand fw-bold fs-4" routerLink="/">
      <i class="bi bi-tree-fill"></i> Trail Explorer
    </a>

    <!-- Mobile toggle -->
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarNav">

      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" routerLink="/trail-list">Trails</a>
        </li>

        <li class="nav-item" *ngIf="userService.getRole() === 'ROLE_ADMIN'">
          <a class="nav-link" routerLink="/user-management">Users</a>
        </li>
      </ul>

      <ul class="navbar-nav ms-auto">

        <ng-container *ngIf="!userService.isLoggedIn(); else loggedIn">

          <li class="nav-item">
            <a class="btn btn-outline-light me-2" routerLink="/login">Login</a>
          </li>

          <li class="nav-item">
            <a class="btn btn-light text-primary fw-bold" routerLink="/register">Register</a>
          </li>

        </ng-container>

        <ng-template #loggedIn>

          <li class="nav-item me-2">
            <a class="btn btn-light text-primary fw-bold" routerLink="/profile">
              <i class="bi bi-person-circle"></i> Profile
            </a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle fw-semibold" href="#" data-bs-toggle="dropdown">
              {{ getUsername() }}
            </a>

            <ul class="dropdown-menu dropdown-menu-end">
              <li><hr class="dropdown-divider"></li>
              <li>
                <a class="dropdown-item text-danger" href="#" (click)="logout()">
                  <i class="bi bi-box-arrow-right"></i> Logout
                </a>
              </li>
            </ul>
          </li>

        </ng-template>

      </ul>
    </div>
  </div>
</nav>


<router-outlet></router-outlet>
