<h2> Users List</h2>
<table class = "table table-striped">
    <thead>
        <tr>
            <th>Email</th>
            <th>Firstname</th>
            <th>Lastname (Km)</th>
            <th>Role</th>


        </tr>
    </thead>
    <tbody>
        <tr *ngFor = "let user of users">
            <td> {{user.email}} </td>
            <td> {{user.firstname}} </td>
            <td> {{user.lastname}} </td>
            <td> {{user.role}} </td>


            <td>
                <button (click)="deleteUser(user.id!)" class="btn btn-danger"> Delete</button>
            </td>

        </tr>
    </tbody>
</table>
