<div class="map-wrapper">

  <!-- Search -->
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (keyup.enter)="doSearch()"
      placeholder="Search location..."
      autocomplete="off"
    />
    <ul class="search-results" *ngIf="showSearchResults && searchResults.length">
      <li *ngFor="let r of searchResults" (click)="selectSearchResult(r)">
        {{ r.display_name }}
      </li>
    </ul>
  </div>

  <!-- Trail stats -->
  <div class="trail-stats" *ngIf="trailStats">
    🥾 <strong>{{ trailStats.distanceKm }} km</strong>
  </div>

  <!-- Loading -->
  <div class="loading-overlay" *ngIf="isLoading">
    <span class="spinner"></span> Loading trail...
  </div>

  <!-- Add annotation panel -->
  <div class="annotation-panel" *ngIf="showAddPanel">
    <div class="panel-header">
      <span>Add point of interest</span>
      <button class="close-btn" (click)="cancelAddAnnotation()">✕</button>
    </div>

    <div class="type-grid">
      <button
        *ngFor="let t of annotationTypes"
        class="type-btn"
        [class.active]="newAnnotationType === t.value"
        (click)="newAnnotationType = $any(t.value)"
        [style.border-color]="newAnnotationType === t.value ? t.color : 'transparent'"
        [style.background]="newAnnotationType === t.value ? t.color + '22' : ''"
      >
        <span class="type-emoji">{{ t.emoji }}</span>
        <span class="type-label">{{ t.label }}</span>
      </button>
    </div>

    <input
      class="panel-input"
      type="text"
      [(ngModel)]="newAnnotationTitle"
      placeholder="Title (e.g. Fresh water spring)"
      maxlength="60"
    />
    <textarea
      class="panel-textarea"
      [(ngModel)]="newAnnotationDesc"
      placeholder="Description (optional)"
      rows="2"
      maxlength="200"
    ></textarea>

    <div class="panel-actions">
      <button class="btn-cancel" (click)="cancelAddAnnotation()">Cancel</button>
      <button class="btn-save" (click)="addAnnotation()" [disabled]="!newAnnotationTitle.trim()">
        Save
      </button>
    </div>
  </div>

  <!-- Hint -->
  <div class="map-hint" *ngIf="!showAddPanel">
    Click on the map to add a point of interest
  </div>

  <!-- Map -->
  <div #mapContainer class="map-container"></div>

</div>
