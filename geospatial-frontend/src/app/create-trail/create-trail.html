<div class="form-wrap">
  <div class="form-header">
    <p class="form-title">Add new trail</p>
    <p class="form-subtitle">Fill in the details below to create a new trail listing.</p>
  </div>

  <form [formGroup]="trailForm" (ngSubmit)="createTrail()" class="form-grid">

    <div class="form-group full">
      <label class="form-label">Trail name</label>
      <input class="form-input" type="text" formControlName="name"
        placeholder="e.g. Taygetos Summit Trail" />
    </div>

    <div class="form-group full">
      <label class="form-label">Location</label>
      <input class="form-input" type="text" formControlName="location"
        placeholder="e.g. Mikro Papigko, Greece" />
    </div>

    <div class="form-group">
      <label class="form-label">Length (km)</label>
      <input class="form-input" type="number" formControlName="lengthKm"
        placeholder="e.g. 14.2" />
      <span class="error-msg"
        *ngIf="trailForm.get('lengthKm')?.invalid && trailForm.get('lengthKm')?.touched">
        Please enter a valid number (e.g. 5.5)
      </span>
    </div>

    <div class="form-group">
      <label class="form-label">Duration (hours)</label>
      <input class="form-input" type="number" formControlName="duration"
        placeholder="e.g. 6.5" />
      <span class="error-msg"
        *ngIf="trailForm.get('duration')?.invalid && trailForm.get('duration')?.touched">
        Duration must be a positive number
      </span>
    </div>

    <div class="form-group full">
      <label class="form-label">Difficulty</label>
      <select class="form-input" formControlName="difficulty">
        <option value="" disabled>Select difficulty</option>
        <option value="Easy">Easy</option>
        <option value="Mid">Mid</option>
        <option value="Hard">Hard</option>
      </select>
    </div>

    <div class="form-group full">
      <label class="form-label">Description</label>
      <textarea class="form-input" formControlName="description"
        placeholder="Describe the trail..."></textarea>
    </div>

    <hr class="form-divider" />

    <div class="form-group full">
      <label class="form-label">Cover photo</label>
      <p-fileupload
        mode="basic"
        [chooseLabel]="selectedFile ? selectedFile.name : 'Choose image'"
        chooseIcon="pi pi-upload"
        name="file"
        accept="image/*"
        [auto]="false"
        (onSelect)="onFileSelect($event)"
        styleClass="custom-upload">
        
      </p-fileupload>
    </div>

    <button type="submit" class="submit-btn" [disabled]="trailForm.invalid">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
        stroke-linecap="round">
        <path d="M8 2v9M4 6l4-4 4 4"/><path d="M2 13h12"/>
      </svg>
      Add trail
    </button>

  </form>
</div>
