<div class="reviews-summary">

  <div class="summary-left">

    <div class="average-score">
      ⭐ {{ averageRating.toFixed(1) }}
    </div>

    <div class="summary-text">
      based on {{ reviews.length }} reviews
    </div>

  </div>

  <div class="rating-breakdown">

    <div class="rating-row" *ngFor="let star of [5,4,3,2,1]">

      <span class="star-label">{{ star }}★</span>

      <div class="bar">
        <div class="fill"
          [style.width.%]="(ratingCounts[star] / reviews.length) * 100">
        </div>
      </div>

      <span class="count">
        {{ ratingCounts[star] }}
      </span>

    </div>

  </div>

</div>
<div class="reviews-list">

  <div class="review-card" *ngFor="let review of reviews">

    <div class="review-top">
      <div class="user-info">
        <div class="avatar">
          {{ review.userEmail[0]?.toUpperCase() }}
        </div>

        <div>
          <div class="user-email">{{ review.userEmail }}</div>
          <div class="review-date">{{ review.createdAt | date:'MMM d, y' }}</div>
        </div>
      </div>

      <div class="stars">
        <ng-container *ngFor="let s of [1,2,3,4,5]">
          <svg class="star"
               [class.star-empty]="s > review.rating"
               viewBox="0 0 16 16">
            <path d="M8 1l1.9 3.9L14 5.6l-3 2.9.7 4.1L8 10.5l-3.7 2.1.7-4.1-3-2.9 4.1-.7z"/>
          </svg>
        </ng-container>
      </div>
    </div>

    <div class="review-comment">
      {{ review.comment }}
    </div>

    <div class="review-footer">
      <span class="trail-chip">Trail #{{ review.trailId }}</span>

      <button class="del-btn"
        *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === review.userEmail"
        (click)="deleteReview(review.id!)">
        Delete
      </button>
    </div>

  </div>

</div>
<div class="empty-state" *ngIf="!reviews.length">
  No reviews yet ⭐
</div>
