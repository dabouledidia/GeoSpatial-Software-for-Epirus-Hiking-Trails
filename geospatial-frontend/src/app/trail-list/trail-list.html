<div class="trails-grid">
  <div *ngFor="let trail of paginatedTrails()" class="trail-card">

    <img [src]="'http://localhost:8080/' + trail.image" class="trail-img" />

    <div class="trail-body">
      <div class="trail-header">
        <p class="trail-name" (click)="getTrail(trail.id!)">{{ trail.trailName }}</p>
        <span class="diff-badge" [ngClass]="{
          'diff-easy': trail.difficulty === 'Easy',
          'diff-medium': trail.difficulty === 'Mid',
          'diff-hard': trail.difficulty === 'Hard'
        }">{{ trail.difficulty }}</span>
      </div>

      <div class="trail-meta">
        <div class="meta-item">
          <span class="meta-label">Location</span>
          <span class="meta-value">{{ trail.location }}</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Length</span>
          <span class="meta-value">{{ trail.lengthKm }} km</span>
        </div>
        <div class="meta-item">
          <span class="meta-label">Duration</span>
          <span class="meta-value">{{ trail.duration }} h</span>
        </div>
      </div>

      <p class="trail-desc">
        {{ trail.description.length > 100 ? (trail.description | slice:0:100) + '...' : trail.description }}
        <a *ngIf="trail.description.length > 100" href="#"
          (click)="showFullComment(trail.description); $event.preventDefault()">[more]</a>
      </p>

      <div class="card-actions">
        <button class="btn-action btn-primary" (click)="createReview(trail.id!)">Create review</button>
        <button class="btn-action" (click)="getReviews(trail.id!)">Reviews</button>
        <button *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email"
          class="btn-action btn-danger" (click)="confirmDeleteTrail(trail.id!)">Delete</button>
      </div>
    </div>
  </div>
</div>

<div class="pagination-wrap">
  <p-paginator [rows]="5" [totalRecords]="trails.length"
    (onPageChange)="onPageChange($event)"></p-paginator>
</div>

<p-dialog header="Full description" [(visible)]="displayCommentDialog" [style]="{width: '30vw'}">
  <p>{{ fullComment }}</p>
</p-dialog>

<p-confirmDialog />
