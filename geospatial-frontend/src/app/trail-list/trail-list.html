<h2> Trail List</h2>
<button (click)="getUserTrails()" >My Trail List</button>
<table class = "table table-striped">
    <thead>
        <tr>
            <th>Trail Name</th>
            <th>Location</th>
            <th>Length (Km)</th>
            <th>Duration</th>
            <th>Difficulty</th>
            <th>Description</th>
            <th>User Id</th>

        </tr>
    </thead>
    <tbody>
        <tr *ngFor = "let trail of trails">
            <td> {{trail.trailName}} </td>
            <td> {{trail.location}} </td>
            <td> {{trail.lengthKm}} </td>
            <td> {{trail.duration}} </td>
            <td> {{trail.difficulty}} </td>
            <td> {{trail.description}} </td>
            <td> {{trail.email}} </td>

            <td>
                <button (click)="deleteTrail(trail.id!)" class="btn btn-danger"> Delete</button>
            </td>
            <td>
                <button (click)="createReview(trail.id!)" class="btn btn-primary"> Create Review</button>
            </td>
            <td>
                <button (click)="getReviews(trail.id!)" class="btn btn-primary"> Reviews</button>
            </td>
        </tr>
    </tbody>
</table>
