<div class="container mt-3">
  <h4>Add Review for Trail #{{ trailId }}</h4>

  <div class="mt-3">
    <input type="number" [(ngModel)]="rating" placeholder="Rating (1–5)" class="form-control mb-2" />
    <textarea [(ngModel)]="comment" placeholder="Your comment..." class="form-control mb-2"></textarea>
    <button (click)="submitReview()" class="btn btn-primary">Submit</button>
  </div>
</div>
