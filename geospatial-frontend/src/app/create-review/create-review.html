<div class="container mt-3">
  <h4>Add Review for Trail #{{ trailId }}</h4>

  <div class="mt-3">
    <p-rating [(ngModel)]="rating"  class="form-control mb-2" />
    <textarea [(ngModel)]="comment" placeholder="Your comment..." class="form-control mb-2"></textarea>
    <p-button (click)="submitReview()" label="Submit">
