<div *ngIf="trail; else loading" class="container">

  <p-card class="trail-card">

    <ng-template #header>
      <img [src]="'http://localhost:8080/' + trail.image" class="header-img" />
    </ng-template>

    <ng-template #title>
      <div class="title">{{ trail.trailName }}</div>
    </ng-template>

    <div class="trail-info">
      <div><strong>📍 Location:</strong> {{ trail.location }}</div>
      <div><strong>📏 Length:</strong> {{ trail.lengthKm }} km</div>
      <div><strong>⏱ Duration:</strong> {{ trail.duration }} H</div>
      <div><strong>🔥 Difficulty:</strong> {{ trail.difficulty }}</div>
    </div>

    <div class="description">
      <strong>Description:</strong>
      <p>{{ trail.description }}</p>
    </div>

    <div class="map-container">
      <app-map-view 
        [searchLocation]="trail.location" 
        [trailName]="trail.trailName">
      </app-map-view>
    </div>

    <div *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email"
         class="upload-section">

      <input type="file"
             multiple
             accept="image/*"
             (change)="onImagesSelect($event)" />

      <button pButton
              label="Ανέβασμα ({{ selectedImages.length }})"
              icon="pi pi-upload"
              (click)="addImages(trail.id!)"
              [disabled]="selectedImages.length === 0">
      </button>
    </div>

    <div class="actions">
      <button pButton label="Create Review" icon="pi pi-pencil" (click)="createReview(trail.id!)"></button>
      <button pButton label="Reviews" icon="pi pi-comments" class="p-button-secondary"
              (click)="getReviews(trail.id!)"></button>
      <button *ngIf="userService.getRole() === 'ROLE_ADMIN' || userService.getUser() === trail.email"
              pButton label="Delete" icon="pi pi-trash"
              class="p-button-danger"
              (click)="deleteTrail(trail.id!)"></button>
    </div>

  </p-card>
</div>

<ng-template #loading>
  <div class="loading">
    <p-progressSpinner />
  </div>
</ng-template>

<h3 class="photos-title">📸 Photos</h3>

<p-carousel [value]="images" [numVisible]="1" [numScroll]="1" [circular]="true" class="carousel">
  <ng-template pTemplate="item" let-img>
    <div class="carousel-item">
      <img [src]="'http://localhost:8080/uploads/' + img.imageURL"
           [alt]="trail.trailName"
           class="carousel-img" />
    </div>
  </ng-template>
</p-carousel>
